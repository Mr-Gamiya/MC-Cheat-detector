[workspace]
resolver = "2"
members = ["crates/scanner-core", "crates/scanner-gui"]

[workspace.package]
version = "8.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2"
# 2.x releases are yanked upstream; pin the current 9.0 line explicitly to
# keep resolution reproducible. JAR inspection needs only ZIP/DEFLATE reading.
zip = { version = "=9.0.4", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_Threading"] }

